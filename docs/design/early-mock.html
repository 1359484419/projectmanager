document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ CONFIRM ============ -->\n  <sc-if value=\"{{ confirm }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeConfirm }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:center;justify-content:center;animation:fadeIn .12s;\">\n      <div onclick=\"{{ stop }}\" style=\"width:380px;max-width:92vw;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:20px;\">\n        <div style=\"font-size:15px;font-weight:650;margin-bottom:8px;\">{{ confirm.title }}<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:20px;\">{{ confirm.msg }}<\u002Fdiv>\n        <div style=\"display:flex;justify-content:flex-end;gap:9px;\"><button onclick=\"{{ closeConfirm }}\" style=\"height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:12.5px;cursor:pointer;\">取消<\u002Fbutton><button onclick=\"{{ doConfirm }}\" style=\"height:32px;padding:0 16px;border-radius:8px;border:none;background:var(--type-bug);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;\">{{ confirm.action }}<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:11px 15px;animation:toastIn .16s ease;\">\n      <span dangerouslysetinnerhtml=\"{{ toastIcon }}\" style=\"width:16px;height:16px;display:flex;flex:none;\"><\u002Fspan>\n      <span style=\"font-size:13px;color:var(--text);\">{{ toast.msg }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n ;padding:0 11px;margin-bottom:12px;\"><span style=\"font-size:13px;color:var(--faint);font-family:'JetBrains Mono',monospace;\">/t/<\u002Fspan><input placeholder=\"acme\" style=\"flex:1;height:34px;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:'JetBrains Mono',monospace;\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <label style=\"display:block;font-size:12px;color:var(--dim);margin-bottom:5px;\">邮箱<\u002Flabel>\n          <input placeholder=\"you@acme.io\" style=\"width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:13px;padding:0 11px;margin-bottom:12px;\">\n          <label style=\"display:block;font-size:12px;color:var(--dim);margin-bottom:5px;\">密码<\u002Flabel>\n          <input type=\"password\" placeholder=\"••••••••\" style=\"width:100%;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:13px;padding:0 11px;margin-bottom:18px;\">\n          <button onclick=\"{{ enterApp }}\" style=\"width:100%;height:38px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;\">{{ authCta }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.members = [\n      { id:'u1', name:'张明', initials:'ZM', email:'zhangming@acme.io', role:'Owner', color:'#6e79d6', cap:8 },\n      { id:'u2', name:'李婷', initials:'LT', email:'liting@acme.io', role:'Member', color:'#3f9d6b', cap:8 },\n      { id:'u3', name:'王强', initials:'WQ', email:'wangqiang@acme.io', role:'Member', color:'#d6673f', cap:6 },\n      { id:'u4', name:'赵磊', initials:'ZL', email:'zhaolei@acme.io', role:'Member', color:'#c74d8a', cap:8 },\n      { id:'u5', name:'陈静', initials:'CJ', email:'chenjing@acme.io', role:'Member', color:'#4aa3c9', cap:6 }\n    ];\n    this.epics = [\n      { id:'e1', name:'用户认证', color:'#6e79d6', quarter:'2026-Q3' },\n      { id:'e2', name:'看板体验', color:'#3f9d6b', quarter:'2026-Q3' },\n      { id:'e3', name:'报表分析', color:'#d1a03a', quarter:'2026-Q3' },\n      { id:'e4', name:'通知系统', color:'#c74d8a', quarter:'2026-Q4' },\n      { id:'e5', name:'性能优化', color:'#4aa3c9', quarter:'2026-Q4' },\n      { id:'e6', name:'移动适配', color:'#d6673f', quarter:null }\n    ];\n    this.sprints = [\n      { id:'s24', name:'Sprint 24', status:'ACTIVE', dates:'07-01 → 07-14' },\n      { id:'s25', name:'Sprint 25', status:'PLANNED', dates:'07-15 → 07-28' },\n      { id:'s23', name:'Sprint 23', status:'CLOSED', dates:'06-17 → 06-30' }\n    ];\n    const T = (id,type,title,status,points,a,e,sprint) => ({ id,type,title,status,points,assigneeId:a,epicId:e,sprintId:sprint });\n    const tasks = [\n      T('PM-101','STORY','登录支持第三方 OAuth','DONE',5,'u1','e1','s24'),\n      T('PM-102','STORY','看板卡片虚拟滚动','IN_PROGRESS',3,'u2','e5','s24'),\n      T('PM-103','BUG','拖拽到空列时卡片丢失','IN_PROGRESS',2,'u3','e2','s24'),\n      T('PM-104','TASK','补充燃尽图数据接口','TODO',3,'u4','e3','s24'),\n      T('PM-105','STORY','任务抽屉评论 Tab','COMPLETED',5,'u5','e2','s24'),\n      T('PM-106','BUG','暗色下图表网格不可见','TODO',1,'u1','e3','s24'),\n      T('PM-107','TASK','接入 PAT 鉴权中间件','DONE',2,'u2','e1','s24'),\n      T('PM-108','STORY','容量条超载斜纹样式','COMPLETED',3,'u3','e2','s24'),\n      T('PM-109','TASK','路线图季度分组渲染','TODO',2,'u4','e5','s24'),\n      T('PM-110','BUG','邀请链接过期无提示','IN_PROGRESS',1,'u5','e1','s24'),\n      T('PM-111','STORY','全局搜索占位交互','TODO',3,'u1','e2','s24'),\n      T('PM-112','TASK','Toast 组件封装','COMPLETED',2,'u2','e4','s24'),\n      T('PM-113','STORY','报表每人负载横条','IN_PROGRESS',5,'u3','e3','s24'),\n      T('PM-114','BUG','移动端侧边栏溢出','DONE',2,'u4','e6','s24'),\n      T('PM-115','TASK','Skeleton 加载态统一','DONE',3,'u5','e2','s24'),\n      T('PM-116','STORY','Epic 颜色选择器','COMPLETED',3,'u2','e2','s23'),\n      T('PM-117','BUG','关闭 Sprint 缺确认框','DONE',2,'u1','e2','s23'),\n      T('PM-201','TASK','命令面板 Cmd+K','TODO',5,'u4','e2',null),\n      T('PM-202','STORY','任务批量操作','TODO',8,'u3','e2',null),\n      T('PM-203','TASK','键盘快捷键系统','TODO',3,'u5','e5',null),\n      T('PM-204','STORY','邮件通知模板','TODO',5,null,'e4',null),\n      T('PM-205','BUG','PAT 复制按钮无反馈','TODO',1,'u2','e1',null)\n    ];\n    this.state = {\n      page:'board', dark:true, collapsed:false,\n      drawerId:null, drawerTab:'comments',\n      backlogFilter:'ALL', quickTitle:'', quickType:'STORY', quickPoints:3,\n      tasks, hist:{}, comments:{}, commentDraft:'',\n      toast:null, confirm:null, showAuth:false, authTab:'login',\n      patToken:'', inviteLink:'', autoRotate:true,\n      showEpicModal:false, epicName:'', epicColor:'#6e79d6', epicQuarter:'2026-Q3',\n      projMenu:false, userMenu:false, loading:false,\n      dragId:null, dragOverCol:null\n    };\n    this.STATUS = { TODO:'待办', IN_PROGRESS:'进行中', COMPLETED:'待验收', DONE:'已完成' };\n    this.SVAR = { TODO:'todo', IN_PROGRESS:'prog', COMPLETED:'comp', DONE:'done' };\n    this.TYPE = { STORY:'故事', BUG:'缺陷', TASK:'任务' };\n  }\n\n  svg(p, sw) { return { __html:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"${sw||2}\" stroke-linecap=\"round\" stroke-linejoin=\"round\" width=\"100%\" height=\"100%\">${p}<\u002Fsvg>` }; }\n  get ic() {\n    return {\n      dashboard:'<rect width=\"7\" height=\"9\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"5\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"9\" x=\"14\" y=\"12\" rx=\"1\"/><rect width=\"7\" height=\"5\" x=\"3\" y=\"16\" rx=\"1\"/>',\n      backlog:'<path d=\"M8 6h13\"/><path d=\"M8 12h13\"/><path d=\"M8 18h13\"/><path d=\"M3 6h.01\"/><path d=\"M3 12h.01\"/><path d=\"M3 18h.01\"/>',\n      board:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"/><path d=\"M8 7v7\"/><path d=\"M12 7v4\"/><path d=\"M16 7v9\"/>',\n      sprints:'<path d=\"m17
